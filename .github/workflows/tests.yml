name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            wheels/*.whl

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install private classifier package
        run: |
          python -m pip install \
            ./wheels/v1_clip_classification_model-0.1.0-py3-none-any.whl

      - name: Install application and development dependencies
        run: |
          python -m pip install -e ".[api,dev]"

      - name: Verify FFmpeg installation
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run tests
        run: |
          pytest
